[package]
name = "kinfolio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kinfolio on NEAR: a family trust that holds native BTC and ETH through Chain Signatures"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
bech32 = { version = "0.11", default-features = false, features = ["alloc"] }
ripemd = { version = "0.1", default-features = false }
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
bitcoin = { version = "0.32", default-features = false, features = ["std", "secp-recovery"] }
hex = { version = "0.4", features = ["std"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
